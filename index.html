<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ระบบบันทึกการลา | HR Leave Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #667eea;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 50px;
            width: fit-content;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }

        .status-dot.online {
            background: #00C851;
        }

        /* Form Section */
        .form-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .form-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .employee-selector {
            width: 100%;
        }

        .employee-selector label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .employee-selector select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .employee-selector select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-employee-btn {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 12px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .add-employee-btn:hover {
            background: #e0e0e0;
        }

        .leave-type-selector {
            width: 100%;
        }

        .leave-type-selector label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .leave-type-selector select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .leave-type-selector select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .date-time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Summary Cards */
        .summary-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .employee-summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .employee-summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .employee-summary-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .employee-summary-header i {
            font-size: 2rem;
        }

        .employee-summary-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .leave-summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .leave-summary-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(10px);
        }

        .leave-summary-item .label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leave-summary-item .value {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .total-summary {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* Records Section */
        .records-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            background: #f0f0f0;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-tab i {
            font-size: 0.9rem;
        }

        .filter-tab:hover {
            background: #e0e0e0;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            width: 250px;
            font-size: 0.95rem;
        }

        .records-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .category-header h3 {
            color: #333;
            font-size: 1.1rem;
            flex: 1;
        }

        .category-header span {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.85rem;
        }

        .category-records {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .record-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .employee-name {
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .employee-name i {
            color: #667eea;
            font-size: 0.9rem;
        }

        .record-dates {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .record-dates i {
            margin-right: 3px;
            color: #667eea;
        }

        .record-reason {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 8px 10px;
            margin: 8px 0;
            font-size: 0.9rem;
            color: #555;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            border-left: 3px solid #667eea;
        }

        .record-reason i {
            color: #667eea;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .record-reason span {
            flex: 1;
            line-height: 1.4;
            word-break: break-word;
        }

        .record-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .record-duration {
            padding: 4px 10px;
            background: #e3f2fd;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #1976d2;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .record-duration.full-day {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .record-actions {
            display: flex;
            gap: 5px;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: #f0f0f0;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: #e0e0e0;
        }

        .btn-icon.delete:hover {
            background: #ffebee;
            color: #f44336;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .modal-btn.save {
            background: #667eea;
            color: white;
        }

        .modal-btn.cancel {
            background: #f0f0f0;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .date-time-row {
                grid-template-columns: 1fr;
            }
            
            .records-container {
                grid-template-columns: 1fr;
            }
            
            .section-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
            
            .filter-tabs {
                overflow-x: auto;
                padding-bottom: 5px;
            }
        }

        /* Sweet Alert Customization */
        .swal2-popup {
            border-radius: 20px !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .swal2-title {
            color: #333 !important;
        }

        .swal2-confirm {
            border-radius: 10px !important;
            padding: 10px 30px !important;
            font-weight: 600 !important;
        }

        .swal2-cancel {
            border-radius: 10px !important;
            padding: 10px 30px !important;
            font-weight: 600 !important;
        }

        .swal2-timer-progress-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-calendar-alt"></i>
                ระบบบันทึกการลา HR
            </h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">กำลังตรวจสอบการเชื่อมต่อ...</span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <h2 class="form-title">
                <i class="fas fa-plus-circle"></i>
                บันทึกการลาใหม่
            </h2>
            
            <div class="form-row">
                <div class="employee-selector">
                    <label><i class="fas fa-user"></i> พนักงาน</label>
                    <select id="employeeSelect">
                        <option value="">เลือกพนักงาน</option>
                    </select>
                    <button class="add-employee-btn" id="addEmployeeBtn">
                        <i class="fas fa-plus"></i>
                        เพิ่มพนักงานใหม่
                    </button>
                </div>

                <div class="leave-type-selector">
                    <label><i class="fas fa-tag"></i> ประเภทการลา</label>
                    <select id="leaveTypeSelect">
                        <option value="personal">🏠 ลากิจ</option>
                        <option value="sick">🤒 ลาป่วย</option>
                        <option value="sick-cert">📋 ป่วยมีใบรับรองแพทย์</option>
                        <option value="vacation">🏖️ ลาพักร้อน</option>
                        <option value="late">⏰ มาสาย</option>
                        <option value="early">🚶 กลับก่อน</option>
                    </select>
                </div>
            </div>

            <div class="date-time-row">
                <div class="input-group">
                    <label><i class="far fa-calendar"></i> วันที่เริ่มต้น</label>
                    <input type="datetime-local" id="startDate" value="">
                </div>
                <div class="input-group">
                    <label><i class="far fa-calendar"></i> วันที่สิ้นสุด</label>
                    <input type="datetime-local" id="endDate" value="">
                </div>
            </div>

            <!-- เพิ่มช่องกรอกเหตุผลการลา -->
            <div class="input-group">
                <label><i class="fas fa-pen"></i> เหตุผลการลา</label>
                <textarea id="leaveReason" placeholder="กรุณาระบุเหตุผลการลา..." rows="3"></textarea>
            </div>

            <button class="submit-btn" id="saveBtn">
                <i class="fas fa-save"></i>
                บันทึกการลา
            </button>
        </div>

        <!-- Employee Summary Section -->
        <div class="summary-section">
            <h2 class="form-title">
                <i class="fas fa-chart-pie"></i>
                สรุปยอดการลาแยกตามพนักงาน
            </h2>
            <div class="employee-summary-cards" id="employeeSummary">
                <!-- Summary cards will be generated here -->
            </div>
        </div>

        <!-- Records Section -->
        <div class="records-section">
            <div class="section-header">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all">
                        <i class="fas fa-list"></i>
                        ทั้งหมด
                    </button>
                    <button class="filter-tab" data-filter="personal">
                        <i class="fas fa-user"></i>
                        ลากิจ
                    </button>
                    <button class="filter-tab" data-filter="sick">
                        <i class="fas fa-thermometer-half"></i>
                        ลาป่วย
                    </button>
                    <button class="filter-tab" data-filter="sick-cert">
                        <i class="fas fa-file-medical"></i>
                        ป่วยมีใบรับรอง
                    </button>
                    <button class="filter-tab" data-filter="vacation">
                        <i class="fas fa-umbrella-beach"></i>
                        ลาพักร้อน
                    </button>
                    <button class="filter-tab" data-filter="late">
                        <i class="fas fa-clock"></i>
                        มาสาย
                    </button>
                    <button class="filter-tab" data-filter="early">
                        <i class="fas fa-sign-out-alt"></i>
                        กลับก่อน
                    </button>
                </div>
                <input type="text" class="search-box" id="searchInput" placeholder="ค้นหาตามชื่อพนักงาน...">
            </div>

            <div class="records-container" id="recordsContainer">
                <!-- Records will be displayed here -->
            </div>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal" id="employeeModal">
        <div class="modal-content">
            <h3><i class="fas fa-user-plus"></i> เพิ่มพนักงานใหม่</h3>
            <input type="text" id="newEmployeeName" placeholder="ชื่อ-นามสกุล พนักงาน">
            <div class="modal-buttons">
                <button class="modal-btn save" id="saveEmployeeBtn">บันทึก</button>
                <button class="modal-btn cancel" id="cancelEmployeeBtn">ยกเลิก</button>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Sweet Alert 2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Configuration - ใช้ค่าจากคุณโดยตรง
        const firebaseConfig  = {
            apiKey: "AIzaSyCbifgH3HKy04ZWfTrK-A0nf00a9mal6js",
            authDomain: "savedata-base.firebaseapp.com",
            databaseURL: "https://savedata-base-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "savedata-base",
            storageBucket: "savedata-base.firebasestorage.app",
            messagingSenderId: "843886650987",
            appId: "1:843886650987:web:75b5b4543f54f1dca1f32e",
            measurementId: "G-VFD2FXQ4WQ"
        };

        // State Management
        let employees = [];
        let leaves = [];
        let currentFilter = 'all';
        let isOnline = navigator.onLine;
        let db = null;
        let firebaseInitialized = false;

        // Leave type mapping
        const leaveTypeNames = {
            'personal': 'ลากิจ',
            'sick': 'ลาป่วย',
            'sick-cert': 'ป่วยมีใบรับรองแพทย์',
            'vacation': 'ลาพักร้อน',
            'late': 'มาสาย',
            'early': 'กลับก่อน'
        };

        const leaveTypeIcons = {
            'personal': 'fa-user',
            'sick': 'fa-thermometer-half',
            'sick-cert': 'fa-file-medical',
            'vacation': 'fa-umbrella-beach',
            'late': 'fa-clock',
            'early': 'fa-sign-out-alt'
        };

        const leaveTypeColors = {
            'personal': '#FF6B6B',
            'sick': '#4ECDC4',
            'sick-cert': '#45B7D1',
            'vacation': '#96CEB4',
            'late': '#FFE194',
            'early': '#D4A5A5'
        };

        function formatHoursAndMinutes(hoursDecimal) {
    if (hoursDecimal <= 0) return "0 นาที";

    const totalMinutes = Math.round(hoursDecimal * 60);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    if (hours === 0) {
        return `${minutes} นาที`;
    } else if (minutes === 0) {
        return `${hours} ชั่วโมง`;
    } else {
        return `${hours} ชั่วโมง ${minutes} นาที`;
        // หรืออยากย่อ → `${hours}:${minutes.toString().padStart(2, '0')}`
    }
}

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeDateTime();
            loadFromLocalStorage();
            updateEmployeeSelect();
            updateUI();
            setupEventListeners();
            checkConnection();
            initializeFirebase();
            
            // Monitor online/offline status
            window.addEventListener('online', handleConnectionChange);
            window.addEventListener('offline', handleConnectionChange);
        });

        function initializeDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            
            // Set start time to 08:00

        // Calculate actual working hours by excluding lunch break (12:00-13:00)
        function calculateActualHours(start, end) {
            const startDate = new Date(start);
            const endDate = new Date(end);
            
            let totalHours = 0;
            let currentDate = new Date(startDate);
            
            while (currentDate < endDate) {
                const currentHour = currentDate.getHours();
                const currentMinutes = currentDate.getMinutes();
                const currentTimeInMinutes = currentHour * 60 + currentMinutes;
                
                // Lunch break 12:00-13:00 (720-780 minutes)
                const lunchStart = 12 * 60; // 12:00 = 720 minutes
                const lunchEnd = 13 * 60; // 13:00 = 780 minutes
                
                // Skip lunch break
                if (currentTimeInMinutes >= lunchStart && currentTimeInMinutes < lunchEnd) {
                    currentDate.setMinutes(currentDate.getMinutes() + 1);
                    continue;
                }
                
                // Add 1 minute at a time
                totalHours += 1 / 60; // Add 1 minute (1/60 hour)
                currentDate.setMinutes(currentDate.getMinutes() + 1);
            }
            
            return totalHours;
        }

        // Calculate duration in days (8 hours = 1 day) with lunch break deduction for all leave types
        function calculateDurationInDays(start, end, leaveType) {
            const actualHours = calculateActualHours(start, end);
            
            // ถ้าครบ 8 ชั่วโมง ให้นับเป็น 1 วัน
            if (actualHours >= 8) {
                return 1;
            }
            
            return actualHours / 8;
        }

        // Calculate duration for display with lunch break deduction for all leave types
function calculateDuration(start, end, leaveType) {
    const actualHours = calculateActualHours(start, end);
    
    // ถ้าเกินหรือเท่ากับ 8 ชม. → แสดงเป็นวัน + เหลือเป็น ชม:นาที
    if (actualHours >= 8) {
        const days = Math.floor(actualHours / 8);
        const remainingHours = actualHours % 8;
        
        if (remainingHours === 0) {
            return `${days} วัน`;
        }
        
        return `${days} วัน ${formatHoursAndMinutes(remainingHours)}`;
    }
    
    // น้อยกว่า 1 วัน → แสดงเป็น ชั่วโมง นาที
    return formatHoursAndMinutes(actualHours);
}

        // Calculate total leave summary by employee
 function calculateEmployeeSummary() {
    const summary = {};
    
    employees.forEach(emp => {

        }
    });

}


        // ฟังก์ชันแปลงจำนวนวันเป็นรูปแบบวันและชั่วโมง
function formatDaysAndHours(days) {
    if (days <= 0) return '0 วัน';
    if (days === 0) return '0 นาที';

    const totalMinutes = Math.round(days * 8 * 60); // แปลงวันเป็นนาที
    const wholeDays = Math.floor(totalMinutes / (8 * 60));
    const remainingMinutes = totalMinutes % (8 * 60);

    if (wholeDays === 0) {
        return formatMinutesToThai(remainingMinutes);
    }
    
    if (remainingMinutes === 0) {
        return `${wholeDays} วัน`;
    }
    
    return `${wholeDays} วัน ${formatMinutesToThai(remainingMinutes)}`;
}

// ฟังก์ชันแปลงนาทีเป็นรูปแบบไทย
function formatMinutesToThai(minutes) {
    if (minutes < 60) {
        return `${minutes} นาที`;
    }
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if (mins === 0) {
        return `${hours} ชั่วโมง`;
    }
    return `${hours} ชั่วโมง ${mins} นาที`;
}

        async function loadFromFirebase() {
            try {
                // โหลดข้อมูลจาก holidayRecords ตาม rules ที่ให้มา
                const snapshot = await db.ref('holidayRecords').once('value');
                const firebaseLeaves = snapshot.val();
                
                if (firebaseLeaves) {
                    const firebaseList = Object.values(firebaseLeaves);
                    
                    // รวมข้อมูลจาก Firebase กับข้อมูลในเครื่อง
                    const mergedLeaves = [...leaves];
                    
                    firebaseList.forEach(fbLeave => {
                        const existingIndex = mergedLeaves.findIndex(l => l.id === fbLeave.id);
                        if (existingIndex >= 0) {
                            mergedLeaves[existingIndex] = fbLeave;
                        } else {
                            mergedLeaves.push(fbLeave);
                        }
                    });
                    
                    // เรียงลำดับตามวันที่บันทึก
                    leaves = mergedLeaves.sort((a, b) => 
                        new Date(b.timestamp) - new Date(a.timestamp)
                    );
                    
                    saveToLocalStorage();
                    updateUI();
                    console.log('โหลดข้อมูลจาก Firebase สำเร็จ');
                }
            } catch (error) {
                console.log('Error loading from Firebase:', error);
            }
        }

                                            minute: '2-digit'
                                        })} - 
                                        ${new Date(leave.endDate).toLocaleString('th-TH', {
                                            day: 'numeric',
                                            month: 'short',
                                            year: 'numeric',
                                            hour: '2-digit',
                                            minute: '2-digit'
                                        })}
                                    </div>
                                    <!-- แสดงเหตุผลการลา -->
                                    <div class="record-reason">
                                        <i class="fas fa-quote-left"></i>
                                        <span>${leave.reason || 'ไม่ได้ระบุเหตุผล'}</span>
                                    </div>
                                    <div class="record-footer">
                                        <span class="record-duration ${isFullDay(leave) ? 'full-day' : ''}">
    <i class="far fa-clock"></i>
    ${leave.duration}
    ${!isFullDay(leave) ? ' (หักพักเที่ยง)' : ''}
</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            recordsContainer.innerHTML = html;
        }

        // Make deleteLeave function globally available
        window.deleteLeave = deleteLeave;
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</body>
</html>
