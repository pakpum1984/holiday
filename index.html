// ────────────────────────────────────────────────
// Helper Functions
// ────────────────────────────────────────────────
function formatHoursAndMinutes(hoursDecimal) {
    if (hoursDecimal <= 0) return "0 นาที";
    const totalMinutes = Math.round(hoursDecimal * 60);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    if (hours === 0) return `${minutes} นาที`;
    if (minutes === 0) return `${hours} ชั่วโมง`;
    return `${hours} ชั่วโมง ${minutes} นาที`;
}

function formatDaysAndHours(days) {
    if (days <= 0) return '0 วัน';
    const totalMinutes = Math.round(days * 8 * 60);
    const wholeDays = Math.floor(totalMinutes / (8 * 60));
    const remainingMinutes = totalMinutes % (8 * 60);
    if (wholeDays === 0) return formatMinutesToThai(remainingMinutes);
    if (remainingMinutes === 0) return `${wholeDays} วัน`;
    return `${wholeDays} วัน ${formatMinutesToThai(remainingMinutes)}`;
}

function formatMinutesToThai(minutes) {
    if (minutes < 60) return `${minutes} นาที`;
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if (mins === 0) return `${hours} ชั่วโมง`;
    return `${hours} ชั่วโมง ${mins} นาที`;
}

function getEmployeeName(employeeId) {
    const emp = employees.find(e => e.id === employeeId);
    return emp ? emp.name : 'ไม่ระบุชื่อ';
}

function calculateActualHours(start, end) {
    let totalHours = 0;
    let current = new Date(start);
    const endTime = new Date(end);
    while (current < endTime) {
        const minutes = current.getHours() * 60 + current.getMinutes();
        if (minutes >= 720 && minutes < 780) { // 12:00 - 13:00 หยุดพักกลางวัน
            current.setMinutes(current.getMinutes() + 1);
            continue;
        }
        totalHours += 1 / 60;
        current.setMinutes(current.getMinutes() + 1);
    }
    return totalHours;
}

function calculateDurationInDays(start, end) {
    const hours = calculateActualHours(start, end);
    return hours / 8; // สามารถปรับเป็น floor หรือ logic อื่นได้
}

function calculateDuration(start, end) {
    const hours = calculateActualHours(start, end);
    if (hours >= 8) {
        const days = Math.floor(hours / 8);
        const rem = hours % 8;
        return rem === 0 ? `${days} วัน` : `${days} วัน ${formatHoursAndMinutes(rem)}`;
    }
    return formatHoursAndMinutes(hours);
}

function initializeDateTime() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    now.setHours(8, 0, 0, 0);
    document.getElementById('startDate').value = now.toISOString().slice(0, 16);
    now.setHours(17, 0, 0, 0);
    document.getElementById('endDate').value = now.toISOString().slice(0, 16);
}

    document.getElementById('openLeaveModalBtn').onclick = () => { currentEditingLeaveId = null; openLeaveModal(); };

    document.getElementById('closeDetailModalBtn').onclick = closeDetailModal;
    document.getElementById('saveBtn').onclick = saveLeave;

        ? '<i class="fas fa-save"></i> อัปเดตการลา'

        document.getElementById('employeeSelect').value = '';

function closeLeaveModal() {

function openEmployeeModal() {

function addEmployee() {
    const name = document.getElementById('newEmployeeName').value.trim();
    if (!name) return Swal.fire({title:'กรุณากรอกชื่อ',icon:'warning',confirmButtonColor:'#667eea'});

    const newEmp = { id: Date.now().toString(), name };
    employees.push(newEmp);
    saveToLocalStorage();
    if (isOnline && firebaseInitialized) saveEmployeesToFirebase();

    updateEmployeeSelect();
    document.getElementById('employeeSelect').value = newEmp.id;
    closeEmployeeModal();
    openLeaveModal();
    updateEmployeeSummary();

    Swal.fire({title:'เพิ่มพนักงานสำเร็จ',text:name,icon:'success',timer:1500,showConfirmButton:false});
}

function updateEmployeeSelect() {
    const select = document.getElementById('employeeSelect');
    select.innerHTML = '<option value="">เลือกพนักงาน</option>';
    employees.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.textContent = emp.name;
        select.appendChild(opt);
    });
}

function calculateEmployeeSummary() {
    const summary = {};
    employees.forEach(emp => {
        summary[emp.id] = {
            employeeId: emp.id,
            employeeName: emp.name,
            total: 0,
            byType: { personal:0, sick:0, 'sick-cert':0, vacation:0, late:0, early:0, 'forgot-clock':0 }
        };
    });

    leaves.forEach(leave => {
        if (summary[leave.employeeId]) {
            const d = leave.days;
            summary[leave.employeeId].total += d;
            if (summary[leave.employeeId].byType[leave.type] !== undefined) {
                summary[leave.employeeId].byType[leave.type] += d;
            }
        }
    });
    return summary;
}

                        <div class="value">${formatDaysAndHours(emp.byType.late)}</div>
                    </div>
                    <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'early')">
                        <div class="label"><i class="fas fa-sign-out-alt"></i> กลับก่อน</div>
                        <div class="value">${formatDaysAndHours(emp.byType.early)}</div>
                    </div>
                    <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'forgot-clock')">
                        <div class="label"><i class="fas fa-id-card-slash"></i> ลืมรูดบัตร</div>
                        <div class="value">${formatDaysAndHours(emp.byType['forgot-clock'])}</div>
                    </div>
                </div>
                <div class="total-summary" onclick="openDetailModal('${emp.employeeId}')">
                    <span>รวมทั้งหมด</span>
                    <span>${formatDaysAndHours(emp.total)}</span>
                </div>
            </div>`;
    });
    container.innerHTML = html;
}

async function saveLeave() {
    const employeeId = document.getElementById('employeeSelect').value;
    const type = document.getElementById('leaveTypeSelect').value;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const reason = document.getElementById('leaveReason').value.trim();

    if (!employeeId || !type || !start || !end || !reason) {
        Swal.fire({title:'ข้อมูลไม่ครบถ้วน',icon:'warning',confirmButtonColor:'#667eea'});
        return;
    }
    if (new Date(end) <= new Date(start)) {
        Swal.fire({title:'วันที่สิ้นสุดต้องมากกว่าวันเริ่มต้น',icon:'error',confirmButtonColor:'#667eea'});
        return;
    }

    const days = calculateDurationInDays(start, end);

    const record = {
        id: currentEditingLeaveId || Date.now().toString(),
        employeeId,
        employeeName: getEmployeeName(employeeId),
        type,
        typeName: leaveTypeNames[type],
        startDate: start,
        endDate: end,
        duration: calculateDuration(start, end),
        days,
        reason,
        timestamp: new Date().toISOString(),
        updatedAt: currentEditingLeaveId ? new Date().toISOString() : undefined
    };

    if (currentEditingLeaveId) {
        const index = leaves.findIndex(l => l.id === currentEditingLeaveId);
        if (index !== -1) leaves[index] = record;
    } else {
        leaves.unshift(record);
    }

    saveToLocalStorage();
    if (isOnline && firebaseInitialized) await saveToFirebase(record);

    updateEmployeeSummary();
    closeLeaveModal();

    Swal.fire({
        title: currentEditingLeaveId ? 'อัปเดตสำเร็จ!' : 'บันทึกสำเร็จ!',
        icon: 'success',
        timer: 1200,
        showConfirmButton: false
    });
}

function editLeave(leaveId) {
    const leave = leaves.find(l => l.id === leaveId);
    if (!leave) return;

    currentEditingLeaveId = leaveId;

    // เติมข้อมูลลงฟอร์ม
    document.getElementById('employeeSelect').value = leave.employeeId;
    document.getElementById('leaveTypeSelect').value = leave.type;
    document.getElementById('startDate').value = leave.startDate.slice(0,16);
    document.getElementById('endDate').value = leave.endDate.slice(0,16);
    document.getElementById('leaveReason').value = leave.reason;

    // สำคัญ! ปิด modal รายละเอียดก่อน
    closeDetailModal();

    // จากนั้นค่อยเปิด modal แก้ไข
    openLeaveModal();
}


async function deleteLeave(leaveId) {
    const result = await Swal.fire({
        title: 'ยืนยันการลบ?',
        text: "การกระทำนี้ไม่สามารถกู้คืนได้",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'ลบเลย',
        cancelButtonText: 'ยกเลิก'
    });

    if (!result.isConfirmed) return;

    leaves = leaves.filter(l => l.id !== leaveId);
    saveToLocalStorage();

    if (isOnline && firebaseInitialized) {
        try { await db.ref('holidayRecords/' + leaveId).remove(); }
        catch (e) { console.error('Delete Firebase error:', e); }
    }

    updateEmployeeSummary();
    Swal.fire('ลบสำเร็จ', '', 'success');
}

function createLeaveCardHTML(leave, overrideColor = null) {
    const color = overrideColor || leaveTypeColors[leave.type] || '#667eea';
    return `
        <div class="detail-record-card" style="border-left-color:${color};">
            <div class="record-actions">
                <button class="action-btn edit" onclick="editLeave('${leave.id}')" title="แก้ไข"><i class="fas fa-edit"></i></button>
                <button class="action-btn delete" onclick="deleteLeave('${leave.id}')" title="ลบ"><i class="fas fa-trash-alt"></i></button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <i class="fas ${leaveTypeIcons[leave.type]}" style="color:${color};"></i>
                    <span style="font-weight:600;">${leave.typeName}</span>
                </div>

            </div>
            <div style="margin-bottom:10px;padding-left:10px;border-left:2px solid ${color};">
                <i class="fas fa-quote-left" style="color:${color};opacity:0.6;margin-right:6px;"></i>
                ${leave.reason || '(ไม่มีเหตุผล)'}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.9rem;">
                <span style="color:${color};"><i class="far fa-clock"></i> ${leave.duration}</span>
                <span style="color:#555;">
                    ${new Date(leave.startDate).toLocaleDateString('th-TH',{day:'numeric',month:'short'})} –
                    ${new Date(leave.endDate).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
                </span>
            </div>
        </div>`;
}

function openDetailModal(employeeId) {
    const emp = employees.find(e => e.id === employeeId);
    if (!emp) return;

    const empLeaves = leaves.filter(l => l.employeeId === employeeId)
        .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

    const totalDays = empLeaves.reduce((s, l) => s + l.days, 0);
    const totalCount = empLeaves.length;

    let html = `
        <div class="employee-detail-header" style="background:linear-gradient(135deg,#667eea,#764ba2); color:white; padding:20px; border-radius:15px; text-align:center;">
            <i class="fas fa-user-circle" style="font-size:3.5rem; margin-bottom:10px;"></i>
            <div>
                <h3>${emp.name}</h3>
                <p>ประวัติการลาทั้งหมด ${totalCount} ครั้ง รวม ${formatDaysAndHours(totalDays)}</p>
            </div>
        </div>

        <h4 style="margin:20px 0 15px; color:#333;"><i class="fas fa-history"></i> ประวัติการลาทั้งหมด</h4>
        <div class="detail-records">
    `;

    if (empLeaves.length === 0) {
        html += `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>ยังไม่มีประวัติการลา</p></div>`;
    } else {
        empLeaves.forEach(leave => html += createLeaveCardHTML(leave));
    }
    html += '</div>';

    document.getElementById('employeeDetailContent').innerHTML = html;
    document.getElementById('employeeDetailModal').classList.add('active');
}

function openFilteredDetailModal(employeeId, filterType) {
    const emp = employees.find(e => e.id === employeeId);
    if (!emp) return;

    const filtered = leaves.filter(l => l.employeeId === employeeId && l.type === filterType)
        .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

    const typeName = leaveTypeNames[filterType] || filterType;
    const typeIcon = leaveTypeIcons[filterType] || 'fa-question';
    const typeColor = leaveTypeColors[filterType] || '#667eea';

    const totalCount = filtered.length;
    const totalDays = filtered.reduce((s,l)=>s+l.days,0);

    let html = `
        <div class="employee-detail-header" style="background:linear-gradient(135deg,${typeColor}dd,${typeColor}88); color:white; padding:20px; border-radius:15px; text-align:center;">
            <i class="fas ${typeIcon}" style="font-size:3.5rem; margin-bottom:10px;"></i>
            <div>
                <h3>${emp.name}</h3>
                <p>${typeName} ทั้งหมด ${totalCount} ครั้ง รวม ${formatDaysAndHours(totalDays)}</p>
            </div>
        </div>

        <h4 style="margin:20px 0 15px; color:${typeColor};"><i class="fas ${typeIcon}"></i> ประวัติ${typeName}</h4>
        <div class="detail-records">
    `;

    if (filtered.length === 0) {
        html += `<div class="empty-state"><i class="fas ${typeIcon}"></i><p>ยังไม่มีบันทึก${typeName}</p></div>`;
    } else {
        filtered.forEach(leave => html += createLeaveCardHTML(leave, typeColor));
    }
    html += '</div>';

    document.getElementById('employeeDetailContent').innerHTML = html;
    document.getElementById('employeeDetailModal').classList.add('active');
}

// ────────────────────────────────────────────────
// Firebase & Storage
// ────────────────────────────────────────────────
async function initializeFirebase() {
    try {
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            firebaseInitialized = true;

            await loadFromFirebase();
            await loadEmployeesFromFirebase();
            updateConnectionStatus();
        }
    } catch (err) {
        console.error('Firebase init failed:', err);
    }
}

async function saveToFirebase(leave) {
    try { await db.ref('holidayRecords/' + leave.id).set(leave); }
    catch (e) { console.error('Save to Firebase error:', e); }
}

async function saveEmployeesToFirebase() {
    try { await db.ref('users').set(employees); }
    catch (e) { console.error('Save employees error:', e); }
}

async function loadFromFirebase() {
    try {
        const snap = await db.ref('holidayRecords').once('value');
        const data = snap.val();
        if (data) {
            Object.values(data).forEach(fb => {
                const idx = leaves.findIndex(l => l.id === fb.id);
                if (idx >= 0) leaves[idx] = { ...leaves[idx], ...fb };
                else leaves.push(fb);
            });
            leaves.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            saveToLocalStorage();
            updateEmployeeSummary();
        }
    } catch (e) { console.error('Load leaves error:', e); }
}

async function loadEmployeesFromFirebase() {
    try {
        const snap = await db.ref('users').once('value');
        const data = snap.val();
        if (Array.isArray(data)) {
            data.forEach(fbEmp => {
                const idx = employees.findIndex(e => e.id === fbEmp.id);
                if (idx >= 0) employees[idx] = { ...employees[idx], ...fbEmp };
                else employees.push(fbEmp);
            });
            saveToLocalStorage();
            updateEmployeeSelect();
            updateEmployeeSummary();
        }
    } catch (e) { console.error('Load employees error:', e); }
}

function handleConnectionChange() {
    isOnline = navigator.onLine;
    updateConnectionStatus();
    if (isOnline && firebaseInitialized) syncWithFirebase();
}

function updateConnectionStatus() {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (isOnline && firebaseInitialized) {
        dot.className = 'status-dot online';
        txt.textContent = 'ออนไลน์ (ซิงค์แล้ว)';
    } else if (isOnline) {
        dot.className = 'status-dot';
        txt.textContent = 'ออนไลน์ (โหมดออฟไลน์)';
    } else {
        dot.className = 'status-dot';
        txt.textContent = 'ออฟไลน์';
    }
}

function checkConnection() { updateConnectionStatus(); }

async function syncWithFirebase() {
    try {
        for (const leave of leaves) await saveToFirebase(leave);
        await saveEmployeesToFirebase();
    } catch (e) { console.error('Sync error:', e); }
}

function saveToLocalStorage() {
    localStorage.setItem('employees', JSON.stringify(employees));
    localStorage.setItem('leaves', JSON.stringify(leaves));
}

function loadFromLocalStorage() {
    const emps = localStorage.getItem('employees');
    if (emps) employees = JSON.parse(emps);

    const lv = localStorage.getItem('leaves');
    if (lv) leaves = JSON.parse(lv);
}

// Global access
window.openDetailModal = openDetailModal;
window.openFilteredDetailModal = openFilteredDetailModal;
window.editLeave = editLeave;
window.deleteLeave = deleteLeave;
</script>
