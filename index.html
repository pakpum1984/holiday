<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ระบบบันทึกการลา | HR Leave Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #667eea;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-leave-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .add-leave-btn i {
            font-size: 0.9rem;
        }

        .add-leave-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 50px;
            width: fit-content;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }

        .status-dot.online {
            background: #00C851;
        }

        /* Summary Cards */
        .summary-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .summary-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .employee-summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .employee-summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .employee-summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .employee-summary-card::after {
            content: '\f06e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 0.3;
            font-size: 1.2rem;
            transition: opacity 0.3s;
        }

        .employee-summary-card:hover::after {
            opacity: 0.8;
        }

        .employee-summary-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .employee-summary-header i {
            font-size: 2rem;
        }

        .employee-summary-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .leave-summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .leave-summary-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s;
        }

        .leave-summary-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .leave-summary-item .label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leave-summary-item .value {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .total-summary {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(5px);
        }

        @media (min-width: 768px) {
            .modal {
                align-items: center;
            }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 25px 25px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @media (min-width: 768px) {
            .modal-content {
                border-radius: 20px;
                animation: modalSlideIn 0.3s ease;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .modal-header h2 {
            color: #333;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h2 i {
            color: #667eea;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #f44336;
            background: #f0f0f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .employee-selector select,
        .leave-type-selector select,
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s;
        }

        .employee-selector select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .date-time-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .date-time-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .add-employee-btn {
            margin-top: 10px;
            padding: 12px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 12px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .employee-detail-modal {
            max-width: 800px;
        }

        .employee-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        @media (min-width: 768px) {
            .employee-detail-header {
                flex-direction: row;
                text-align: left;
            }
        }

        .employee-detail-header i {
            font-size: 3rem;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .summary-stats {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .detail-records {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .detail-record-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }

        .small-modal {
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .modal-btn.save {
            background: #667eea;
            color: white;
        }

        .modal-btn.cancel {
            background: #f0f0f0;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 15px;
            color: #666;
        }

        .empty-state i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-calendar-alt"></i> ระบบบันทึกการลา HR</h1>
            <div class="header-actions">
               
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">กำลังตรวจสอบ...</span>
                </div>
                 <button class="add-leave-btn" id="openLeaveModalBtn">
                    <i class="fas fa-plus-circle"></i> บันทึกการลา
                </button>
            </div>
        </div>

        <div class="summary-section">
            <h2 class="summary-title">
                <i class="fas fa-chart-pie"></i>
                สรุปยอดการลาแยกตามพนักงาน
                <!-- <span style="font-size: 0.8rem; color: #666; margin-left: 10px;">(กดที่ประเภทเพื่อดูรายการเฉพาะ)</span> -->
            </h2>
            <div class="employee-summary-cards" id="employeeSummary"></div>
        </div>
    </div>

    <!-- Leave Form Modal -->
    <div class="modal" id="leaveFormModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> บันทึกการลาใหม่</h2>
                <button class="modal-close" id="closeLeaveModalBtn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="form-row">
                <div class="employee-selector">
                    <label><i class="fas fa-user"></i> พนักงาน</label>
                    <select id="employeeSelect">
                        <option value="">เลือกพนักงาน</option>
                    </select>
                    <button class="add-employee-btn" id="addEmployeeBtn">
                        <i class="fas fa-plus"></i> เพิ่มพนักงานใหม่
                    </button>
                </div>

                <div class="leave-type-selector">
                    <label><i class="fas fa-tag"></i> ประเภทการลา</label>
                    <select id="leaveTypeSelect">
                        <option value="personal">🏠 ลากิจ</option>
                        <option value="sick">🤒 ลาป่วย</option>
                        <option value="sick-cert">📋 ป่วยมีใบรับรองแพทย์</option>
                        <option value="vacation">🏖️ ลาพักร้อน</option>
                        <option value="late">⏰ มาสาย</option>
                        <option value="early">🚶 กลับก่อน</option>
                        <option value="forgot-clock">❓ ลืมรูดบัตร</option>
                    </select>
                </div>
            </div>

            <div class="date-time-row">
                <div class="input-group">
                    <label><i class="far fa-calendar"></i> วันที่เริ่มต้น</label>
                    <input type="datetime-local" id="startDate">
                </div>
                <div class="input-group">
                    <label><i class="far fa-calendar"></i> วันที่สิ้นสุด</label>
                    <input type="datetime-local" id="endDate">
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-pen"></i> เหตุผลการลา</label>
                <textarea id="leaveReason" placeholder="กรุณาระบุเหตุผลการลา..." rows="4"></textarea>
            </div>

            <button class="submit-btn" id="saveBtn">
                <i class="fas fa-save"></i> บันทึกการลา
            </button>
        </div>
    </div>

    <!-- Employee Detail Modal -->
    <div class="modal" id="employeeDetailModal">
        <div class="modal-content employee-detail-modal">
            <div class="modal-header">
                <h2><i class="fas fa-user-circle"></i> รายละเอียดการลาพนักงาน</h2>
                <button class="modal-close" id="closeDetailModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div id="employeeDetailContent"></div>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal" id="employeeModal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> เพิ่มพนักงานใหม่</h3>
                <button class="modal-close" id="closeEmployeeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="newEmployeeName" placeholder="ชื่อ-นามสกุล พนักงาน">
            <div class="modal-buttons">
                <button class="modal-btn save" id="saveEmployeeBtn">บันทึก</button>
                <button class="modal-btn cancel" id="cancelEmployeeBtn">ยกเลิก</button>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Sweet Alert 2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Firebase SDK (เวอร์ชัน 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCbifgH3HKy04ZWfTrK-A0nf00a9mal6js",
            authDomain: "savedata-base.firebaseapp.com",
            databaseURL: "https://savedata-base-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "savedata-base",
            storageBucket: "savedata-base.firebasestorage.app",
            messagingSenderId: "843886650987",
            appId: "1:843886650987:web:75b5b4543f54f1dca1f32e",
            measurementId: "G-VFD2FXQ4WQ"
        };

        // State
        let employees = [];
        let leaves = [];
        let isOnline = navigator.onLine;
        let db = null;
        let firebaseInitialized = false;

        // Leave type mappings
        const leaveTypeNames = {
            'personal': 'ลากิจ',
            'sick': 'ลาป่วย',
            'sick-cert': 'ป่วยมีใบรับรองแพทย์',
            'vacation': 'ลาพักร้อน',
            'late': 'มาสาย',
            'early': 'กลับก่อน',
            'forgot-clock': 'ลืมรูดบัตร'
        };

        const leaveTypeIcons = {
            'personal': 'fa-user',
            'sick': 'fa-thermometer-half',
            'sick-cert': 'fa-file-medical',
            'vacation': 'fa-umbrella-beach',
            'late': 'fa-clock',
            'early': 'fa-sign-out-alt',
            'forgot-clock': 'fa-id-card-slash'
        };

        const leaveTypeColors = {
            'personal': '#FF6B6B',
            'sick': '#4ECDC4',
            'sick-cert': '#45B7D1',
            'vacation': '#96CEB4',
            'late': '#FFE194',
            'early': '#D4A5A5',
            'forgot-clock': '#9B59B6'
        };

        // Helpers
        function formatHoursAndMinutes(hoursDecimal) {
            if (hoursDecimal <= 0) return "0 นาที";
            const totalMinutes = Math.round(hoursDecimal * 60);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            if (hours === 0) return `${minutes} นาที`;
            if (minutes === 0) return `${hours} ชั่วโมง`;
            return `${hours} ชั่วโมง ${minutes} นาที`;
        }

        function formatDaysAndHours(days) {
            if (days <= 0) return '0 วัน';
            const totalMinutes = Math.round(days * 8 * 60);
            const wholeDays = Math.floor(totalMinutes / (8 * 60));
            const remainingMinutes = totalMinutes % (8 * 60);

            if (wholeDays === 0) return formatMinutesToThai(remainingMinutes);
            if (remainingMinutes === 0) return `${wholeDays} วัน`;
            return `${wholeDays} วัน ${formatMinutesToThai(remainingMinutes)}`;
        }

        function formatMinutesToThai(minutes) {
            if (minutes < 60) return `${minutes} นาที`;
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            if (mins === 0) return `${hours} ชั่วโมง`;
            return `${hours} ชั่วโมง ${mins} นาที`;
        }

        function getEmployeeName(employeeId) {
            const emp = employees.find(e => e.id === employeeId);
            return emp ? emp.name : 'ไม่ระบุชื่อ';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeDateTime();
            loadFromLocalStorage();
            updateEmployeeSelect();
            updateEmployeeSummary();
            setupEventListeners();
            checkConnection();
            initializeFirebase();

            window.addEventListener('online', handleConnectionChange);
            window.addEventListener('offline', handleConnectionChange);
        });

        function initializeDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            now.setHours(8, 0, 0, 0);
            document.getElementById('startDate').value = now.toISOString().slice(0, 16);

            now.setHours(17, 0, 0, 0);
            document.getElementById('endDate').value = now.toISOString().slice(0, 16);
        }

        function setupEventListeners() {
            document.getElementById('openLeaveModalBtn').onclick = openLeaveModal;
            document.getElementById('closeLeaveModalBtn').onclick = closeLeaveModal;
            document.getElementById('closeDetailModalBtn').onclick = closeDetailModal;
            document.getElementById('saveBtn').onclick = saveLeave;
            document.getElementById('addEmployeeBtn').onclick = () => { closeLeaveModal(); openEmployeeModal(); };
            document.getElementById('saveEmployeeBtn').onclick = addEmployee;
            document.getElementById('cancelEmployeeBtn').onclick = closeEmployeeModal;
            document.getElementById('closeEmployeeModalBtn').onclick = closeEmployeeModal;

            window.onclick = (e) => {
                if (e.target.classList.contains('modal')) {
                    if (e.target.id === 'leaveFormModal') closeLeaveModal();
                    if (e.target.id === 'employeeModal') closeEmployeeModal();
                    if (e.target.id === 'employeeDetailModal') closeDetailModal();
                }
            };
        }

        function openLeaveModal() {
            document.getElementById('leaveFormModal').classList.add('active');
            initializeDateTime();
            document.getElementById('leaveReason').value = '';
        }

        function closeLeaveModal() {
            document.getElementById('leaveFormModal').classList.remove('active');
        }

        function openEmployeeModal() {
            document.getElementById('employeeModal').classList.add('active');
            document.getElementById('newEmployeeName').value = '';
        }

        function closeEmployeeModal() {
            document.getElementById('employeeModal').classList.remove('active');
        }

        function closeDetailModal() {
            document.getElementById('employeeDetailModal').classList.remove('active');
        }

        function addEmployee() {
            const name = document.getElementById('newEmployeeName').value.trim();
            if (!name) {
                Swal.fire({ title: 'กรุณากรอกชื่อ', icon: 'warning', confirmButtonColor: '#667eea' });
                return;
            }

            const newEmp = { id: Date.now().toString(), name };
            employees.push(newEmp);
            saveToLocalStorage();
            if (isOnline && firebaseInitialized) saveEmployeesToFirebase();

            updateEmployeeSelect();
            document.getElementById('employeeSelect').value = newEmp.id;
            closeEmployeeModal();
            openLeaveModal();
            updateEmployeeSummary();

            Swal.fire({ title: 'เพิ่มพนักงานสำเร็จ', text: name, icon: 'success', timer: 1500, showConfirmButton: false });
        }

        function updateEmployeeSelect() {
            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">เลือกพนักงาน</option>';
            employees.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = emp.name;
                select.appendChild(opt);
            });
        }

        function calculateActualHours(start, end) {
            let totalHours = 0;
            let current = new Date(start);
            const endTime = new Date(end);

            while (current < endTime) {
                const h = current.getHours();
                const m = current.getMinutes();
                const minutes = h * 60 + m;

                if (minutes >= 12*60 && minutes < 13*60) {
                    current.setMinutes(current.getMinutes() + 1);
                    continue;
                }

                totalHours += 1/60;
                current.setMinutes(current.getMinutes() + 1);
            }
            return totalHours;
        }

        function calculateDurationInDays(start, end) {
            const hours = calculateActualHours(start, end);
            return hours >= 8 ? Math.floor(hours / 8) + (hours % 8)/8 : hours / 8;
        }

        function calculateDuration(start, end) {
            const hours = calculateActualHours(start, end);
            if (hours >= 8) {
                const days = Math.floor(hours / 8);
                const rem = hours % 8;
                return rem === 0 ? `${days} วัน` : `${days} วัน ${formatHoursAndMinutes(rem)}`;
            }
            return formatHoursAndMinutes(hours);
        }

        function calculateEmployeeSummary() {
            const summary = {};
            employees.forEach(emp => {
                summary[emp.id] = {
                    employeeId: emp.id,
                    employeeName: emp.name,
                    total: 0,
                    byType: {
                        personal: 0, sick: 0, 'sick-cert': 0,
                        vacation: 0, late: 0, early: 0, 'forgot-clock': 0
                    }
                };
            });

            leaves.forEach(leave => {
                if (summary[leave.employeeId]) {
                    const d = leave.days;
                    summary[leave.employeeId].total += d;
                    if (summary[leave.employeeId].byType[leave.type] !== undefined) {
                        summary[leave.employeeId].byType[leave.type] += d;
                    }
                }
            });
            return summary;
        }

        function updateEmployeeSummary() {
            const summary = calculateEmployeeSummary();
            const container = document.getElementById('employeeSummary');

            if (employees.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-users"></i>
                        <p>ยังไม่มีข้อมูลพนักงาน กรุณาเพิ่มพนักงานก่อน</p>
                    </div>`;
                return;
            }

            let html = '';
            Object.values(summary).forEach(emp => {
                html += `
                    <div class="employee-summary-card">
                        <div class="employee-summary-header">
                            <i class="fas fa-user-circle"></i>
                            <h3>${emp.employeeName}</h3>
                        </div>
                        <div class="leave-summary-grid">
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'personal')">
                                <div class="label"><i class="fas fa-user"></i> ลากิจ</div>
                                <div class="value">${formatDaysAndHours(emp.byType.personal)}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'sick')">
                                <div class="label"><i class="fas fa-thermometer-half"></i> ลาป่วย</div>
                                <div class="value">${formatDaysAndHours(emp.byType.sick)}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'sick-cert')">
                                <div class="label"><i class="fas fa-file-medical"></i> ป่วยมีใบ</div>
                                <div class="value">${formatDaysAndHours(emp.byType['sick-cert'])}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'vacation')">
                                <div class="label"><i class="fas fa-umbrella-beach"></i> ลาพักร้อน</div>
                                <div class="value">${formatDaysAndHours(emp.byType.vacation)}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'late')">
                                <div class="label"><i class="fas fa-clock"></i> มาสาย</div>
                                <div class="value">${formatDaysAndHours(emp.byType.late)}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'early')">
                                <div class="label"><i class="fas fa-sign-out-alt"></i> กลับก่อน</div>
                                <div class="value">${formatDaysAndHours(emp.byType.early)}</div>
                            </div>
                            <div class="leave-summary-item" onclick="openFilteredDetailModal('${emp.employeeId}', 'forgot-clock')">
                                <div class="label"><i class="fas fa-id-card-slash"></i> ลืมรูดบัตร</div>
                                <div class="value">${formatDaysAndHours(emp.byType['forgot-clock'])}</div>
                            </div>
                        </div>
                        <div class="total-summary" onclick="openDetailModal('${emp.employeeId}')" style="cursor:pointer;">
                            <span>รวมทั้งหมด</span>
                            <span>${formatDaysAndHours(emp.total)}</span>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function openDetailModal(employeeId) {
            const emp = employees.find(e => e.id === employeeId);
            if (!emp) return;

            const empLeaves = leaves.filter(l => l.employeeId === employeeId)
                .sort((a,b) => new Date(b.startDate) - new Date(a.startDate));

            const totalDays = empLeaves.reduce((s, l) => s + l.days, 0);
            const totalCount = empLeaves.length;

            const byType = {
                personal: empLeaves.filter(l => l.type === 'personal').length,
                sick: empLeaves.filter(l => l.type === 'sick').length,
                'sick-cert': empLeaves.filter(l => l.type === 'sick-cert').length,
                vacation: empLeaves.filter(l => l.type === 'vacation').length,
                late: empLeaves.filter(l => l.type === 'late').length,
                early: empLeaves.filter(l => l.type === 'early').length,
                'forgot-clock': empLeaves.filter(l => l.type === 'forgot-clock').length
            };

            let html = `
                <div class="employee-detail-header" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                    <i class="fas fa-user-circle"></i>
                    <div class="employee-detail-info">
                        <h3>${emp.name}</h3>
                        <p>มีประวัติการลาทั้งหมด ${totalCount} ครั้ง รวม ${formatDaysAndHours(totalDays)}</p>
                    </div>
                </div>

                <div class="summary-stats">
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-user"></i> ลากิจ</div><div class="stat-value">${byType.personal} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-thermometer-half"></i> ลาป่วย</div><div class="stat-value">${byType.sick} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-file-medical"></i> ป่วยมีใบ</div><div class="stat-value">${byType['sick-cert']} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-umbrella-beach"></i> ลาพักร้อน</div><div class="stat-value">${byType.vacation} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-clock"></i> มาสาย</div><div class="stat-value">${byType.late} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-sign-out-alt"></i> กลับก่อน</div><div class="stat-value">${byType.early} ครั้ง</div></div>
                    <div class="stat-card"><div class="stat-label"><i class="fas fa-id-card-slash"></i> ลืมรูดบัตร</div><div class="stat-value">${byType['forgot-clock']} ครั้ง</div></div>
                </div>

                <h4 style="margin-bottom: 15px; color: #333;">
                    <i class="fas fa-history"></i> ประวัติการลาทั้งหมด
                </h4>

                <div class="detail-records">
            `;

            if (empLeaves.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>ไม่มีประวัติการลา</p></div>`;
            } else {
                empLeaves.forEach(leave => {
                    html += createLeaveCardHTML(leave);
                });
            }

            html += `</div>`;
            document.getElementById('employeeDetailContent').innerHTML = html;
            document.getElementById('employeeDetailModal').classList.add('active');
        }

        function openFilteredDetailModal(employeeId, filterType) {
            const emp = employees.find(e => e.id === employeeId);
            if (!emp) return;

            const filtered = leaves
                .filter(l => l.employeeId === employeeId && l.type === filterType)
                .sort((a,b) => new Date(b.startDate) - new Date(a.startDate));

            const typeName  = leaveTypeNames[filterType] || filterType;
            const typeIcon  = leaveTypeIcons[filterType] || 'fa-question';
            const typeColor = leaveTypeColors[filterType] || '#667eea';

            const totalCount = filtered.length;
            const totalDays  = filtered.reduce((s, l) => s + l.days, 0);

            let html = `
                <div class="employee-detail-header" style="background: linear-gradient(135deg, ${typeColor}dd, ${typeColor}88);">
                    <i class="fas ${typeIcon}"></i>
                    <div class="employee-detail-info">
                        <h3>${emp.name}</h3>
                        <p>${typeName} ทั้งหมด ${totalCount} ครั้ง รวม ${formatDaysAndHours(totalDays)}</p>
                    </div>
                </div>

                <h4 style="margin: 20px 0 15px; color: ${typeColor};">
                    <i class="fas ${typeIcon}"></i> ประวัติ${typeName}
                </h4>

                <div class="detail-records">
            `;

            if (filtered.length === 0) {
                html += `
                    <div class="empty-state">
                        <i class="fas ${typeIcon}"></i>
                        <p>ยังไม่มีบันทึก${typeName}</p>
                    </div>`;
            } else {
                filtered.forEach(leave => {
                    html += createLeaveCardHTML(leave, typeColor);
                });
            }

            html += `</div>`;
            document.getElementById('employeeDetailContent').innerHTML = html;
            document.getElementById('employeeDetailModal').classList.add('active');
        }

        function createLeaveCardHTML(leave, overrideColor = null) {
            const color = overrideColor || leaveTypeColors[leave.type] || '#667eea';
            return `
                <div class="detail-record-card" style="border-left-color: ${color};">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <i class="fas ${leaveTypeIcons[leave.type]}" style="color: ${color};"></i>
                            <span style="font-weight: 600;">${leave.typeName}</span>
                        </div>
                        <div style="font-size: 0.85rem; color: #666;">
                            ${new Date(leave.timestamp).toLocaleDateString('th-TH')}
                        </div>
                    </div>
                    <div style="margin-bottom: 10px; padding-left: 10px; border-left: 2px solid ${color};">
                        <i class="fas fa-quote-left" style="color: ${color}; opacity: 0.6; margin-right: 6px;"></i>
                        ${leave.reason || '(ไม่มีเหตุผล)'}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                        <span style="color: ${color};">
                            <i class="far fa-clock"></i> ${leave.duration}
                        </span>
                        <span style="color: #555;">
                            ${new Date(leave.startDate).toLocaleDateString('th-TH', {day:'numeric', month:'short'})} –
                            ${new Date(leave.endDate).toLocaleDateString('th-TH', {day:'numeric', month:'short'})}
                        </span>
                    </div>
                </div>`;
        }

        async function saveLeave() {
            const employeeId = document.getElementById('employeeSelect').value;
            const type       = document.getElementById('leaveTypeSelect').value;
            const start      = document.getElementById('startDate').value;
            const end        = document.getElementById('endDate').value;
            const reason     = document.getElementById('leaveReason').value.trim();

            if (!employeeId || !type || !start || !end || !reason) {
                Swal.fire({ title: 'ข้อมูลไม่ครบ', icon: 'warning', confirmButtonColor: '#667eea' });
                return;
            }

            if (new Date(end) <= new Date(start)) {
                Swal.fire({ title: 'วันที่สิ้นสุดต้องมากกว่าวันเริ่ม', icon: 'error', confirmButtonColor: '#667eea' });
                return;
            }

            const days = calculateDurationInDays(start, end);

            const record = {
                id: Date.now().toString(),
                employeeId,
                employeeName: getEmployeeName(employeeId),
                type,
                typeName: leaveTypeNames[type],
                startDate: start,
                endDate: end,
                duration: calculateDuration(start, end),
                days,
                reason,
                timestamp: new Date().toISOString()
            };

            leaves.unshift(record);
            saveToLocalStorage();

            if (isOnline && firebaseInitialized) {
                await saveToFirebase(record);
            }

            updateEmployeeSummary();
            closeLeaveModal();

            Swal.fire({ title: 'บันทึกสำเร็จ', icon: 'success', timer: 1200, showConfirmButton: false });
        }

        // ────────────────────────────────────────────────
        // Firebase Functions (เหมือนเดิม)
        // ────────────────────────────────────────────────

        async function initializeFirebase() {
            try {
                if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    firebaseInitialized = true;

                    await loadFromFirebase();
                    await loadEmployeesFromFirebase();
                    updateConnectionStatus();
                }
            } catch (err) {
                console.error('Firebase init failed:', err);
            }
        }

        async function saveToFirebase(leave) {
            try { await db.ref('holidayRecords/' + leave.id).set(leave); }
            catch (e) { console.error('Save leave error:', e); }
        }

        async function saveEmployeesToFirebase() {
            try { await db.ref('users').set(employees); }
            catch (e) { console.error('Save employees error:', e); }
        }

        async function loadFromFirebase() {
            try {
                const snap = await db.ref('holidayRecords').once('value');
                const data = snap.val();
                if (data) {
                    const fbLeaves = Object.values(data);
                    // Merge logic (เหมือนเดิม)
                    fbLeaves.forEach(fb => {
                        const idx = leaves.findIndex(l => l.id === fb.id);
                        if (idx >= 0) leaves[idx] = { ...leaves[idx], ...fb };
                        else leaves.push(fb);
                    });
                    leaves.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                    saveToLocalStorage();
                    updateEmployeeSummary();
                }
            } catch (e) { console.error('Load leaves error:', e); }
        }

        async function loadEmployeesFromFirebase() {
            try {
                const snap = await db.ref('users').once('value');
                const data = snap.val();
                if (Array.isArray(data)) {
                    data.forEach(fbEmp => {
                        const idx = employees.findIndex(e => e.id === fbEmp.id);
                        if (idx >= 0) employees[idx] = { ...employees[idx], ...fbEmp };
                        else employees.push(fbEmp);
                    });
                    saveToLocalStorage();
                    updateEmployeeSelect();
                    updateEmployeeSummary();
                }
            } catch (e) { console.error('Load employees error:', e); }
        }

        function handleConnectionChange() {
            isOnline = navigator.onLine;
            updateConnectionStatus();
            if (isOnline && firebaseInitialized) syncWithFirebase();
        }

        function updateConnectionStatus() {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            if (isOnline && firebaseInitialized) {
                dot.className = 'status-dot online';
                txt.textContent = 'ออนไลน์ (ซิงค์แล้ว)';
            } else if (isOnline) {
                dot.className = 'status-dot';
                txt.textContent = 'ออนไลน์ (โหมดออฟไลน์)';
            } else {
                dot.className = 'status-dot';
                txt.textContent = 'ออฟไลน์';
            }
        }

        function checkConnection() { updateConnectionStatus(); }

        async function syncWithFirebase() {
            try {
                for (const leave of leaves) await saveToFirebase(leave);
                await saveEmployeesToFirebase();
            } catch (e) { console.error('Sync error:', e); }
        }

        function saveToLocalStorage() {
            localStorage.setItem('employees', JSON.stringify(employees));
            localStorage.setItem('leaves', JSON.stringify(leaves));
        }

        function loadFromLocalStorage() {
            const emps = localStorage.getItem('employees');
            if (emps) employees = JSON.parse(emps);

            const lv = localStorage.getItem('leaves');
            if (lv) leaves = JSON.parse(lv);
        }

        // ทำให้ฟังก์ชันเรียกจาก HTML ได้
        window.openDetailModal = openDetailModal;
        window.openFilteredDetailModal = openFilteredDetailModal;
    </script>
</body>
</html>
